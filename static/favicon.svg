<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Calendar body -->
  <rect x="2" y="6" width="28" height="23" rx="3" fill="#6366f1"/>
  <!-- Header bar -->
  <rect x="2" y="6" width="28" height="9" rx="3" fill="#4f46e5"/>
  <rect x="2" y="12" width="28" height="3" fill="#4f46e5"/>
  <!-- Binding loops -->
  <rect x="9" y="3" width="3" height="7" rx="1.5" fill="#312e81"/>
  <rect x="20" y="3" width="3" height="7" rx="1.5" fill="#312e81"/>
  <!-- Date cells row 1 -->
  <rect x="6"  y="18" width="5" height="4" rx="1" fill="white" opacity="0.85"/>
  <rect x="14" y="18" width="5" height="4" rx="1" fill="white" opacity="0.85"/>
  <rect x="22" y="18" width="4" height="4" rx="1" fill="white" opacity="0.85"/>
  <!-- Date cells row 2 -->
  <rect x="6"  y="24" width="5" height="3" rx="1" fill="white" opacity="0.55"/>
  <rect x="14" y="24" width="5" height="3" rx="1" fill="white" opacity="0.55"/>
</svg>
