<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>MRO Create account</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon-mro.svg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mro_auth.css') }}" />
</head>
<body class="mro-auth-body">
  <main class="mro-auth-card">
    <div class="mro-auth-brand">
      <span class="mro-auth-logo" aria-hidden="true">MRO</span>
      <div>
        <h1>Create account</h1>
        <p>Requests require admin approval before sign-in.</p>
      </div>
    </div>
    {% if error %}
    <div class="mro-auth-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('mro_auth.mro_register') }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" value="{{ username or '' }}" required autofocus />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" value="{{ email or '' }}" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
      <label for="password_confirm">Confirm password</label>
      <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="8" />
      <button type="submit">Request access</button>
    </form>
    <nav class="mro-auth-links">
      <a href="{{ url_for('mro_auth.mro_login') }}">Back to sign in</a>
    </nav>
  </main>
</body>
</html>
