<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Production Planner{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='nav-erp-sync-20260519') }}" />
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-logo">
      <span class="logo-top">PRODUCTION</span>
      <span class="logo-bottom">PLANNING</span>
    </a>
    <div class="navbar-links">
      <a href="/scheduler"
         class="nav-link {% if active == 'scheduler' %}nav-link--active{% endif %}">
        PLANNER
      </a>
      <a href="/queue-delays"
         class="nav-link {% if active == 'queue_delays' %}nav-link--active{% endif %}">
        QUEUE DELAYS
      </a>
      <a href="/actual-production"
         class="nav-link {% if active == 'actual_production' %}nav-link--active{% endif %}">
        ACTUAL PRODUCTION
      </a>
      <a href="/process-sheets"
         class="nav-link {% if active == 'process_sheets' %}nav-link--active{% endif %}">
        PROCESS SHEETS
      </a>
      <a href="/new-orders"
         class="nav-link {% if active == 'new_orders' %}nav-link--active{% endif %}">
        NEW ORDERS
      </a>

      <div class="nav-dropdown {% if active == 'planning_data' %}nav-dropdown--active{% endif %}">
        <button class="nav-dropdown-trigger" data-dropdown="planning-data">
          PLANNING DATA <span class="nav-caret">▾</span>
        </button>
        <div class="nav-dropdown-menu" id="dd-planning-data">
          <span class="nav-dropdown-section">INVENTORY &amp; PLANNING</span>
          <a href="/planning-data/inventory-bom" class="nav-dropdown-item">Inventory BOM</a>
          <a href="/planning-data/program-tool-list" class="nav-dropdown-item">Program / Tool List</a>
          <a href="/planning-data/machines" class="nav-dropdown-item">Machines</a>
          <a href="/planning-data/cycle-times" class="nav-dropdown-item">Master cycle times</a>
          <a href="/planning-data/materials" class="nav-dropdown-item">Materials</a>
        </div>
      </div>
    </div>
    <div class="navbar-actions">
      <button type="button" class="nav-sync-btn" id="nav-erp-sync-btn" data-default-label="Sync ERP">
        Sync ERP
      </button>
    </div>
  </div>
</nav>

<main class="app-main {% block main_class %}{% endblock %}">
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
