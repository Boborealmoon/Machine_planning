<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planner access</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef0f3;
    }
    .access-card {
      width: min(100%, 360px);
      background: #fff;
      border: 1px solid #e2e6eb;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: var(--shadow-lg);
    }
    .access-card h1 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .access-card p {
      color: var(--text2);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .access-field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }
    .access-field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
    }
    .access-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    .access-submit {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #1a1c1d;
      color: #fff;
      font-weight: 600;
    }
    .access-error {
      margin-top: 12px;
      color: #b42318;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <form class="access-card" method="post" action="{{ url_for('planner_access_gate') }}">
    <h1>Planner access</h1>
    <p>Enter the access code to open the production planner.</p>
    <input type="hidden" name="next" value="{{ next }}" />
    <div class="access-field">
      <label for="token">Access code</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus />
    </div>
    <button class="access-submit" type="submit">Continue</button>
    {% if error %}<p class="access-error">{{ error }}</p>{% endif %}
  </form>
</body>
</html>
