{% extends "shift_management_base.html" %}
{% block title %}Shift record — Day/Night HOTO{% endblock %}
{% block content %}
<section class="sm-record-head">
  <h2 class="sm-section-title" data-sm-t>Shift record</h2>
  <p class="sm-muted" data-sm-t>The production report, HOTO checklist, and tickets filed for one shift.</p>
</section>

<section class="sm-record-bar">
  <label class="sm-field-inline" for="sm-record-date"><span data-sm-t>Date</span>
    <input type="date" id="sm-record-date" />
  </label>
  <div class="sm-chip-row" id="sm-record-shift" role="group" data-sm-aria aria-label="Shift">
    <button type="button" class="sm-chip" data-shift="Day" data-sm-t>Day</button>
    <button type="button" class="sm-chip" data-shift="Night" data-sm-t>Night</button>
  </div>
</section>

<div class="sm-record-recent" id="sm-record-recent" data-sm-aria aria-label="Recent shifts"></div>

<div class="sm-subtabs" id="sm-record-views" role="tablist" data-sm-aria aria-label="Shift record">
  <button type="button" class="sm-subtab is-active" data-record-view="report" role="tab" aria-selected="true" data-sm-t>Report</button>
  <button type="button" class="sm-subtab" data-record-view="hoto" role="tab" aria-selected="false" data-sm-t>HOTO</button>
  <button type="button" class="sm-subtab" data-record-view="tickets" role="tab" aria-selected="false" data-sm-t>Tickets</button>
</div>

<div id="sm-record-panel">
  <p class="sm-muted" data-sm-t>Loading…</p>
</div>
{% endblock %}
{% block scripts %}
<script>
  SM.page = "history";
  SM.hotoLabels = {{ (hoto_labels or [])|tojson }};
</script>
{% endblock %}
