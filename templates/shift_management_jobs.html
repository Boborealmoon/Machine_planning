{% extends "shift_management_base.html" %}
{% block title %}Jobs - Day/Night HOTO{% endblock %}
{% block content %}
<section class="sm-toolbar sm-toolbar-wrap">
  <h2 class="sm-section-title" style="margin:0" data-sm-t>Work instructions</h2>
  <button type="button" class="sm-btn sm-btn-ghost" id="sm-jobs-refresh" data-sm-t>Refresh</button>
</section>
<p class="sm-muted" id="sm-jobs-lead">Choose a machine. Its queue opens so you can pick a process sheet and raise a ticket.</p>

<section class="sm-toolbar">
  <label class="sm-field-inline">
    <span data-sm-t>Date</span>
    <input type="date" id="sm-ops-date" />
  </label>
  <div class="sm-chip-row" id="sm-ops-shift-chips" role="group" data-sm-aria aria-label="Shift">
    <button type="button" class="sm-chip" data-shift="Day" data-sm-t>Day</button>
    <button type="button" class="sm-chip" data-shift="Night" data-sm-t>Night</button>
  </div>
  <label class="sm-field-inline sm-ops-search-field">
    <span data-sm-t>Find</span>
    <input type="search" id="sm-ops-search" data-sm-ph placeholder="Machine or PS no." autocomplete="off" />
  </label>
</section>

<div id="sm-jobs-picker" class="sm-jobs-picker">
  <p class="sm-muted" data-sm-t>Loading...</p>
</div>
<div id="sm-jobs-list" class="sm-jobs-lane" hidden></div>

<dialog id="sm-ticket-dialog" class="sm-dialog">
  <form method="dialog" id="sm-ticket-form" onsubmit="return false;">
    <h3 data-sm-t>Raise ticket</h3>
    <p id="sm-ticket-context" class="sm-muted"></p>
    <input type="hidden" id="sm-tk-machine-id" />
    <input type="hidden" id="sm-tk-block-id" />
    <input type="hidden" id="sm-tk-ps" />
    <input type="hidden" id="sm-tk-job" />
    <label class="sm-label" data-sm-t>Category</label>
    <select class="sm-input" id="sm-tk-category"></select>
    <label class="sm-label" data-sm-t>Priority</label>
    <select class="sm-input" id="sm-tk-priority">
      <option value="Normal" data-sm-t>Normal</option>
      <option value="High" data-sm-t>High</option>
      <option value="Urgent" data-sm-t>Urgent</option>
    </select>
    <label class="sm-label" for="sm-tk-title" data-sm-t>Title</label>
    <input class="sm-input" id="sm-tk-title" type="text" required maxlength="200" />
    <label class="sm-label" for="sm-tk-desc" data-sm-t>Details</label>
    <textarea class="sm-textarea" id="sm-tk-desc" rows="3" data-sm-ph placeholder="What needs attention?"></textarea>
    <p id="sm-tk-status" class="sm-muted" hidden></p>
    <div class="sm-dialog-actions">
      <button type="button" class="sm-btn sm-btn-ghost" id="sm-tk-cancel" data-sm-t>Cancel</button>
      <button type="submit" class="sm-btn sm-btn-primary" id="sm-tk-save" data-sm-t>Create ticket</button>
    </div>
  </form>
</dialog>
{% endblock %}
{% block scripts %}
<script>SM.page = "jobs";</script>
{% endblock %}
